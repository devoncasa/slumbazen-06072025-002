<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><title>SlumbaZEN responsive verification</title><style>body{font:16px sans-serif;margin:20px}iframe{height:850px;border:1px solid #999;display:block;transform-origin:top left}section{overflow:auto;margin:30px 0}label{display:block;margin:15px 0}button{padding:12px}</style></head><body><h1>SlumbaZEN responsive verification</h1><label>Path <input id="path" value="/th"></label><button id="load">Load page</button><div id="frames"></div><script>const widths=[360,390,768,1024,1440];const frames=document.getElementById('frames');for(const width of widths){const section=document.createElement('section');section.innerHTML='<h2>'+width+' px</h2><iframe title="'+width+' px" data-width="'+width+'" width="'+width+'" src="/th"></iframe>';frames.appendChild(section)}document.getElementById('load').onclick=()=>{const path=document.getElementById('path').value;if(!path.startsWith('/')||path.startsWith('//'))return;document.querySelectorAll('iframe').forEach(f=>f.src=path)};</script></body></html>
